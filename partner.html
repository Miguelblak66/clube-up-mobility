<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Painel do Posto - Up Mobility</title>
                <!-- Estilo visual simples e moderno que roda em qualquer celular -->
                    <style>
                            body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; color: #333; }
                                    .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
                                            h2 { color: #0056b3; text-align: center; }
                                                    .box { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 20px; background: #fafafa; }
                                                            label { font-weight: bold; display: block; margin-top: 10px; }
                                                                    input[type="number"], input[type="text"] { width: 95%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
                                                                            button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
                                                                                    button.scan-btn { background-color: #007bff; }
                                                                                            #resultado-validacao { text-align: center; padding: 15px; border-radius: 5px; font-weight: bold; margin-top: 15px; font-size: 18px; display: none; }
                                                                                                    .sucesso { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
                                                                                                            .erro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
                                                                                                                </style>
                                                                                                                    <!-- Biblioteca leve para ler QR Code usando a câmera do celular -->
                                                                                                                        <script src="https://unpkg.com"></script>
                                                                                                                        </head>
                                                                                                                        <body>

                                                                                                                        <div class="container">
                                                                                                                            <h2>Abastece UP Mobility - Painel do Posto</h2>

                                                                                                                                <!-- BLOCO 1: AUTONOMIA DE PREÇOS (PRO GERENTE) -->
                                                                                                                                    <div class="box">
                                                                                                                                            <h3>⛽ Atualizar Preços na Bomba</h3>
                                                                                                                                                    <p style="font-size:12px; color:#666;">Altere os valores abaixo. O aplicativo dos motoristas atualizará na hora.</p>
                                                                                                                                                            
                                                                                                                                                                    <label>Gasolina Comum (Preço com Desconto R\$):</label>
                                                                                                                                                                            <input type="number" id="input-gasolina" step="0.01" value="5.69">

                                                                                                                                                                                    <label>Etanol Comum (Preço com Desconto R\$):</label>
                                                                                                                                                                                            <input type="number" id="input-etanol" step="0.01" value="3.84">

                                                                                                                                                                                                    <button onclick="salvarPrecos()">Salvar e Atualizar no App</button>
                                                                                                                                                                                                        </div>

                                                                                                                                                                                                            <!-- BLOCO 2: VALIDADOR DE QR CODE (PRO CAIXA) -->
                                                                                                                                                                                                                <div class="box">
                                                                                                                                                                                                                        <h3>🔍 Validar Cupom do Motorista</h3>
                                                                                                                                                                                                                                <p style="font-size:12px; color:#666;">Clique no botão abaixo para abrir a câmera do caixa e escanear o QR Code temporário.</p>
                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                <button class="scan-btn" onclick="abrirCameraScanner()">Escanear QR Code</button>
                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                <!-- Espaço onde o leitor de câmera vai aparecer -->
                                                                                                                                                                                                                                                                        <div id="reader" style="width: 100%; margin-top: 15px;"></div>

                                                                                                                                                                                                                                                                                <!-- Tela de Sucesso ou Erro contra fraude -->
                                                                                                                                                                                                                                                                                        <div id="resultado-validacao"></div>
                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                            // Função simulada para salvar os preços (na expansão ela grava no precos.json)
                                                                                                                                                                                                                                                                                            function salvarPrecos() {
                                                                                                                                                                                                                                                                                                const gas = document.getElementById('input-gasolina').value;
                                                                                                                                                                                                                                                                                                    const eta = document.getElementById('input-etanol').value;
                                                                                                                                                                                                                                                                                                        alert(`Preços atualizados com sucesso!\nGasolina: R$ ${gas}\nEtanol: R$ ${eta}`);
                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                        // Lógica de Leitura e Validação Intransferível do QR Code
                                                                                                                                                                                                                                                                                                        function abrirCameraScanner() {
                                                                                                                                                                                                                                                                                                            const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                    html5QrcodeScanner.render((decodedText) => {
                                                                                                                                                                                                                                                                                                                            // Interrompe a câmera após ler
                                                                                                                                                                                                                                                                                                                                    html5QrcodeScanner.clear();
                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                    const resultadoDiv = document.getElementById('resultado-validacao');
                                                                                                                                                                                                                                                                                                                                                            resultadoDiv.style.display = 'block';

                                                                                                                                                                                                                                                                                                                                                                    // O QR Code gerado pelo motorista deve começar com UPM-
                                                                                                                                                                                                                                                                                                                                                                            if (decodedText.startsWith("UPM-")) {
                                                                                                                                                                                                                                                                                                                                                                                        const partes = decodedText.split("-");
                                                                                                                                                                                                                                                                                                                                                                                                    const cpf = partes[1];
                                                                                                                                                                                                                                                                                                                                                                                                                const horaGerada = partes[3]; // Ex: 1430

                                                                                                                                                                                                                                                                                                                                                                                                                            // Pega o horário atual do relógio do caixa do posto
                                                                                                                                                                                                                                                                                                                                                                                                                                        const agora = new Date();
                                                                                                                                                                                                                                                                                                                                                                                                                                                    const horaAtualTexto = agora.getHours().toString().padStart(2, '0') + agora.getMinutes().toString().padStart(2, '0');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Transforma em minutos para calcular a diferença de tempo
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const minGerado = parseInt(horaGerada.substring(0,2)) * 60 + parseInt(horaGerada.substring(2,4));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const minAtual = agora.getHours() * 60 + agora.getMinutes();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Regra Inviolável: Se o código foi gerado há mais de 5 minutos, bloqueia por fraude
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if ((minAtual - minGerado) <= 5) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        resultadoDiv.className = "resultado-validacao sucesso";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        resultadoDiv.innerHTML = `🟢 CUPOM VÁLIDO!<br>Motorista CPF: ${cpf}<br>Desconto Liberado na Bomba.`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    resultadoDiv.className = "resultado-validacao erro";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    resultadoDiv.innerHTML = `🔴 CUPOM EXPIRADO!<br>Este código foi gerado há mais de 5 minutos. Peça para o motorista gerar um novo.`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    resultadoDiv.className = "resultado-validacao erro";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                resultadoDiv.innerHTML = "🔴 CÓDIGO INVÁLIDO!<br>Este QR Code não pertence ao Clube Up Mobility.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
