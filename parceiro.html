<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Painel do Posto - UP Mobility</title>
                <style>
                        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #fafafa; }
                                .box { max-width: 400px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
                                        button { width: 85%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; }
                                                #res { margin-top: 15px; padding: 15px; border-radius: 5px; font-weight: bold; font-size: 18px; display: none; }
                                                    </style>
                                                        <script src="https://unpkg.com"></script>
                                                        </head>
                                                        <body>
                                                            <div class="box">
                                                                    <h2>Painel do Posto</h2>
                                                                            <button onclick="scan()">Escanear QR Code</button>
                                                                                    <div id="reader" style="width:100%; margin-top:15px;"></div>
                                                                                            <div id="res"></div>
                                                                                                </div>
                                                                                                    <script>
                                                                                                            function scan() {
                                                                                                                        const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
                                                                                                                                    scanner.render((txt) => {
                                                                                                                                                    scanner.clear();
                                                                                                                                                                    const res = document.getElementById('res');
                                                                                                                                                                                    res.style.display = 'block';
                                                                                                                                                                                                    if (txt.startsWith("UPM-")) {
                                                                                                                                                                                                                        const partes = txt.split("-");
                                                                                                                                                                                                                                            const cpf = partes[1];
                                                                                                                                                                                                                                                                const horaG = partes[2];
                                                                                                                                                                                                                                                                                    const agora = new Date();
                                                                                                                                                                                                                                                                                                        const minG = parseInt(horaG.substring(0,2)) * 60 + parseInt(horaG.substring(2,4));
                                                                                                                                                                                                                                                                                                                            const minA = agora.getHours() * 60 + agora.getMinutes();
                                                                                                                                                                                                                                                                                                                                                if ((minA - minG) <= 5) {
                                                                                                                                                                                                                                                                                                                                                                        res.style.background = '#d4edda'; res.style.color = '#155724';
                                                                                                                                                                                                                                                                                                                                                                                                res.innerHTML = `🟢 VÁLIDO!<br>CPF: ${cpf}<br>Liberar Desconto.`;
                                                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                            res.style.background = '#f8d7da'; res.style.color = '#721c24';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    res.innerHTML = `🔴 EXPIRADO!<br>Cupom gerado há mais de 5 minutos.`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            res.style.background = '#f8d7da'; res.style.color = '#721c24';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                res.innerHTML = `🔴 INVÁLIDO!<br>Código incorreto.`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
