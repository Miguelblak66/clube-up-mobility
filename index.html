<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Clube de Benefícios - Home</title>
                <style>
                        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
                                body { background-color: #f8fafc; color: #1e293b; padding: 15px; }
                                        .hero { text-align: center; padding: 30px 10px; background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; border-radius: 12px; margin-bottom: 20px; }
                                                .hero h1 { font-size: 1.6rem; margin-bottom: 8px; }
                                                        .hero p { font-size: 0.95rem; opacity: 0.9; }
                                                                .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); margin-bottom: 15px; }
                                                                        h2 { margin-bottom: 15px; color: #0f172a; font-size: 1.2rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
                                                                                .form-group { margin-bottom: 12px; }
                                                                                        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; }
                                                                                                input { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
                                                                                                        button { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 5px; }
                                                                                                                button:hover { background-color: #1d4ed8; }
                                                                                                                        .switch-btn { background-color: transparent; color: #2563eb; border: 1px solid #2563eb; margin-top: 10px; }
                                                                                                                                .hidden { display: none; }
                                                                                                                                        .user-info { background: #f1f5f9; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.95rem; }
                                                                                                                                                .logout-btn { background-color: #dc2626; }
                                                                                                                                                    </style>
                                                                                                                                                    </head>
                                                                                                                                                    <body>

                                                                                                                                                        <div class="hero">
                                                                                                                                                                <h1>Clube Up Mobility</h1>
                                                                                                                                                                        <p>Seu portal de vantagens e descontos exclusivos</p>
                                                                                                                                                                            </div>

                                                                                                                                                                                <div id="loginSection" class="card">
                                                                                                                                                                                        <h2>Entrar na Área do Membro</h2>
                                                                                                                                                                                                <div class="form-group">
                                                                                                                                                                                                            <label>E-mail cadastrado:</label>
                                                                                                                                                                                                                        <input type="email" id="loginEmail" placeholder="exemplo@email.com">
                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                        <div class="form-group">
                                                                                                                                                                                                                                                    <label>Sua Senha:</label>
                                                                                                                                                                                                                                                                <input type="password" id="loginPassword" placeholder="******">
                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                <button onclick="fazerLogin()">Acessar Conta</button>
                                                                                                                                                                                                                                                                                        <button onclick="alternarTelas(true)" class="switch-btn">Não tem conta? Cadastre-se</button>
                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                <div id="registerSection" class="card hidden">
                                                                                                                                                                                                                                                                                                        <h2>Criar Nova Conta no Clube</h2>
                                                                                                                                                                                                                                                                                                                <div class="form-group">
                                                                                                                                                                                                                                                                                                                            <label>Código do Membro (ID Único):</label>
                                                                                                                                                                                                                                                                                                                                        <input type="text" id="regCodigo" placeholder="Ex: UP9988">
                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                        <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                    <label>Nome Completo:</label>
                                                                                                                                                                                                                                                                                                                                                                                <input type="text" id="regNome">
                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                            <label>E-mail:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="email" id="regEmail">
                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label>Telefone / WhatsApp (Opcional):</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="tel" id="regTelefone" placeholder="(00) 99999-0000">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label>Crie uma Senha:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="password" id="regSenha" placeholder="Mínimo 6 caracteres">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="fazerCadastro()">Finalizar Cadastro</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="alternarTelas(false)" class="switch-btn">Já tem conta? Fazer Login</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="memberDashboard" class="card hidden">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h2>Área Exclusiva do Cliente</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="user-info">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p><strong>Nome:</strong> <span id="membroNome">...</span></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p><strong>Seu Código:</strong> <span id="membroCodigo">...</span></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p style="margin-bottom: 15px; font-size: 0.9rem; color: #475569;">Apresente seu código nos parceiros para garantir vantagens.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="fazerLogout()" class="logout-btn">Sair do Clube</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function alternarTelas(mostrarCadastro) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (mostrarCadastro) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('loginSection').classList.add('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('registerSection').classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('registerSection').classList.add('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('loginSection').classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            async function fazerCadastro() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const dados = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        codigo: document.getElementById('regCodigo').value,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        nome: document.getElementById('regNome').value,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        email: document.getElementById('regEmail').value,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        telefone: document.getElementById('regTelefone').value,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        password: document.getElementById('regSenha').value
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const response = await fetch('/functions/api/cadastro', {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                method: 'POST',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                headers: { 'Content-Type': 'application/json' },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                body: JSON.stringify(dados)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const resultado = await response.json();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert(resultado.message || resultado.error);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (response.ok) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                alternarTelas(false);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            async function fazerLogin() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const email = document.getElementById('loginEmail').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const password = document.getElementById('loginPassword').value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const response = await fetch('/functions/api/membro/login', {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                method: 'POST',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                headers: { 'Content-Type': 'application/json' },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                body: JSON.stringify({ email, password })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const resultado = await response.json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (response.ok) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('loginSection').classList.add('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('memberDashboard').classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('membroNome').innerText = resultado.user.nome;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('membroCodigo').innerText = resultado.user.codigo;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                alert(resultado.error || 'Erro ao efetuar login.');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            async function fazerLogout() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        await fetch('/functions/api/membro/logout', { method: 'POST' });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    location.reload();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
