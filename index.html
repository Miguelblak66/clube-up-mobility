<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clube Up Mobility - Login / Cadastro</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
        .header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 20px; text-align: center; border-radius: 12px 12px 0 0; margin: -30px -30px 20px -30px; }
        h2 { margin: 0 0 5px 0; font-size: 24px; }
        .subtitle { margin: 0; font-size: 14px; opacity: 0.9; }
        h3 { margin-top: 0; color: #1e293b; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #333; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; background: #fff; }
        input:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #2563eb; color: white; margin-bottom: 10px; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
        .btn-secondary { background: transparent; color: #2563eb; border: 1px solid #2563eb; }
        .btn-secondary:hover { background: #f0f5ff; }
        .toggle-text { text-align: center; margin-top: 15px; font-size: 14px; }
        .hidden { display: none; }
        .error-msg { color: #ef4444; font-size: 14px; margin-top: 10px; text-align: center; min-height: 20px; }
        .success-msg { color: #15803d; font-size: 14px; margin-top: 10px; text-align: center; min-height: 20px; }
        .field-error { border-color: #ef4444 !important; }
        .links { text-align: center; margin-top: 20px; font-size: 13px; }
        .links a { color: #64748b; text-decoration: none; margin: 0 8px; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Clube Up Mobility</h2>
            <p class="subtitle">Seu portal de vantagens e descontos exclusivos</p>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <div id="login-section">
            <h3>Entrar na Área do Membro</h3>
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-email">E-mail cadastrado:</label>
                    <input type="email" id="login-email" placeholder="exemplo@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="login-senha">Sua Senha:</label>
                    <input type="password" id="login-senha" placeholder="******" autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary" id="btn-login">Acessar Conta</button>
                <button type="button" class="btn-secondary" onclick="toggleForm(true)">Não tem conta? Cadastre-se</button>
            </form>
            <div id="login-error" class="error-msg"></div>
        </div>

        <!-- FORMULÁRIO DE CADASTRO -->
        <div id="cadastro-section" class="hidden">
            <h3>Criar Conta</h3>
            <form id="cadastro-form" novalidate>
                <div class="form-group">
                    <label for="cad-nome">Nome completo: *</label>
                    <input type="text" id="cad-nome" name="cad-nome" placeholder="Seu nome completo" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="cad-email">E-mail: *</label>
                    <input type="email" id="cad-email" name="cad-email" placeholder="exemplo@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="cad-telefone">Telefone:</label>
                    <input type="tel" id="cad-telefone" name="cad-telefone" placeholder="(11) 99999-9999" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label for="cad-profile">Perfil:</label>
                    <select id="cad-profile" name="cad-profile">
                        <option value="cliente">Cliente</option>
                        <option value="motorista">Motorista</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cad-city">Cidade:</label>
                    <input type="text" id="cad-city" name="cad-city" placeholder="Sua cidade">
                </div>
                <div class="form-group">
                    <label for="cad-senha">Senha: *</label>
                    <input type="password" id="cad-senha" name="cad-senha" placeholder="******" autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary" id="btn-cadastro">Cadastrar</button>
                <button type="button" class="btn-secondary" onclick="toggleForm(false)">Já tem conta? Entrar</button>
            </form>
            <div id="cadastro-msg" class="error-msg"></div>
        </div>

        <div class="links">
            <a href="admin.html">Admin</a>
            <a href="parceiro.html">Parceiro</a>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;

        function toggleForm(showCadastro) {
            document.getElementById('login-section').classList.toggle('hidden', showCadastro);
            document.getElementById('cadastro-section').classList.toggle('hidden', !showCadastro);
            document.getElementById('login-error').textContent = '';
            document.getElementById('cadastro-msg').textContent = '';
            document.getElementById('login-error').className = 'error-msg';
            document.getElementById('cadastro-msg').className = 'error-msg';
        }

        function clearErrors(formId) {
            const form = document.getElementById(formId);
            form.querySelectorAll('input, select').forEach(el => el.classList.remove('field-error'));
        }

        function showFieldError(inputId) {
            const el = document.getElementById(inputId);
            if (el) el.classList.add('field-error');
        }

        // LOGIN
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors('login-form');

            const email = document.getElementById('login-email').value.trim();
            const senha = document.getElementById('login-senha').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('btn-login');
            errorEl.textContent = '';
            errorEl.className = 'error-msg';

            if (!email) {
                showFieldError('login-email');
                errorEl.textContent = 'Por favor, preencha o e-mail.';
                return;
            }
            if (!senha) {
                showFieldError('login-senha');
                errorEl.textContent = 'Por favor, preencha a senha.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Entrando...';

            try {
                const response = await fetch(`${API_URL}/api/membros/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, senha: senha })
                });
                const data = await response.json();
                if (response.ok && data.success) {
                    localStorage.setItem('clube_token', data.token);
                    localStorage.setItem('clube_user', JSON.stringify(data.usuario));
                    window.location.href = 'membro.html';
                } else {
                    errorEl.textContent = data.error || 'Erro ao fazer login. Verifique seus dados.';
                }
            } catch (err) {
                errorEl.textContent = 'Erro de conexão. Tente novamente em instantes.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Acessar Conta';
            }
        });

        // CADASTRO
        document.getElementById('cadastro-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors('cadastro-form');

            // Ler valores dos campos
            const nomeEl = document.getElementById('cad-nome');
            const emailEl = document.getElementById('cad-email');
            const telefoneEl = document.getElementById('cad-telefone');
            const profileEl = document.getElementById('cad-profile');
            const cityEl = document.getElementById('cad-city');
            const senhaEl = document.getElementById('cad-senha');

            const nome = nomeEl ? nomeEl.value.trim() : '';
            const email = emailEl ? emailEl.value.trim() : '';
            const telefone = telefoneEl ? telefoneEl.value.trim() : '';
            const profile = profileEl ? profileEl.value : 'cliente';
            const city = cityEl ? cityEl.value.trim() : '';
            const senha = senhaEl ? senhaEl.value : '';

            const msgEl = document.getElementById('cadastro-msg');
            const btn = document.getElementById('btn-cadastro');
            msgEl.textContent = '';
            msgEl.className = 'error-msg';

            // Validação
            let hasError = false;
            if (!nome) { showFieldError('cad-nome'); hasError = true; }
            if (!email) { showFieldError('cad-email'); hasError = true; }
            if (!senha) { showFieldError('cad-senha'); hasError = true; }

            if (hasError) {
                msgEl.textContent = 'Por favor, preencha os campos obrigatórios (*).';
                return;
            }

            // Validação de e-mail
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showFieldError('cad-email');
                msgEl.textContent = 'Por favor, informe um e-mail válido.';
                return;
            }

            if (senha.length < 4) {
                showFieldError('cad-senha');
                msgEl.textContent = 'A senha deve ter pelo menos 4 caracteres.';
                return;
            }

            const dados = {
                nome: nome,
                email: email,
                telefone: telefone,
                profile: profile,
                city: city,
                senha: senha
            };

            btn.disabled = true;
            btn.textContent = 'Cadastrando...';

            try {
                const response = await fetch(`${API_URL}/api/membros/cadastro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                const data = await response.json();
                if (response.ok && data.success) {
                    msgEl.textContent = `✅ Cadastro realizado! Seu código: ${data.codigo}`;
                    msgEl.className = 'success-msg';
                    document.getElementById('cadastro-form').reset();
                    setTimeout(() => toggleForm(false), 3000);
                } else {
                    msgEl.textContent = data.error || 'Erro ao cadastrar. Tente novamente.';
                }
            } catch (err) {
                msgEl.textContent = 'Erro de conexão. Tente novamente em instantes.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Cadastrar';
            }
        });
    </script>
</body>
</html>
