<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | Clube Up Mobility</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --primary: #0f172a;
            --secondary: #f8fafc;
            --text: #0f172a;
            --muted: #475569;
            --border: #e2e8f0;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .topbar {
            background: var(--primary);
            color: #fff;
            padding: 18px 24px;
            font-size: 1.2rem;
            font-weight: 700;
        }
        .main-content {
            max-width: 980px;
            margin: 0 auto;
            width: 100%;
            padding: 26px 20px 60px;
        }
        .card-table {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
            padding: 22px;
        }
        h3 {
            margin: 0 0 16px;
            color: var(--text);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
        th {
            background: var(--secondary);
            color: var(--muted);
            font-weight: 700;
        }
        tr:hover {
            background: #f8fbff;
        }
        .status-ativo {
            color: var(--success);
            font-weight: bold;
        }
        .status-inativo {
            color: var(--danger);
            font-weight: bold;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 16px;
            margin-bottom: 22px;
        }
        .mini-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 6px 20px rgba(15,23,42,0.04);
        }
        .mini-card .label {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .mini-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }
        .alert {
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #92400e;
        }
    </style>
</head>
<body>
    <div class="topbar">⚙️ Painel de Controle - Relatório de Membros Ativos</div>

    <div class="main-content">
        <div class="summary">
            <div class="mini-card">
                <span class="label">Total de membros</span>
                <p id="totalMembros" class="value">0</p>
            </div>
            <div class="mini-card">
                <span class="label">Ativos</span>
                <p id="membrosAtivos" class="value">0</p>
            </div>
            <div class="mini-card">
                <span class="label">Inativos</span>
                <p id="membrosInativos" class="value">0</p>
            </div>
        </div>

        <div class="card-table">
            <h3>Lista de Usuários Cadastrados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Perfil</th>
                        <th>Cidade</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
            </table>
            <div class="alert">Painel administrativo em modo demonstrativo. Conecte a API real para carregar dados dinâmicos.</div>
        </div>
    </div>

    <script>
        const demoMembers = [
            { nome: 'Ana Souza', email: 'ana@teste.com', perfil: 'Cliente', cidade: 'São Paulo', status: 'ativo' },
            { nome: 'Carlos Mendes', email: 'carlos@teste.com', perfil: 'Motorista', cidade: 'Rio de Janeiro', status: 'ativo' },
            { nome: 'Beatriz Lima', email: 'bebel@teste.com', perfil: 'Cliente', cidade: 'Belo Horizonte', status: 'inativo' },
            { nome: 'João Pereira', email: 'joao@teste.com', perfil: 'Motorista', cidade: 'Curitiba', status: 'ativo' }
        ];

        const tbody = document.getElementById('adminTableBody');

        function renderTable(rows) {
            tbody.innerHTML = rows.map((member) => `
                <tr>
                    <td>${member.nome}</td>
                    <td>${member.email}</td>
                    <td>${member.perfil}</td>
                    <td>${member.cidade}</td>
                    <td class="${member.status === 'ativo' ? 'status-ativo' : 'status-inativo'}">
                        ${member.status === 'ativo' ? 'Ativo' : 'Inativo'}
                    </td>
                </tr>
            `).join('');

            document.getElementById('totalMembros').textContent = rows.length;
            document.getElementById('membrosAtivos').textContent = rows.filter(m => m.status === 'ativo').length;
            document.getElementById('membrosInativos').textContent = rows.filter(m => m.status !== 'ativo').length;
        }

        renderTable(demoMembers);
    </script>
</body>
</html>
