 <!DOCTYPE html>
 <html lang="pt-BR">
 <head>
     <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
             <title>Painel Admin - Clube Up Mobility</title>
                 <style>
                         body { font-family: Arial, sans-serif; margin: 0; background: #f1f5f9; display: flex; flex-direction: column; min-height: 100vh; }
                                 .topbar { background: #0f172a; color: white; padding: 15px 20px; font-size: 18px; font-weight: bold; }
                                         .main-content { padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box; }
                                                 .card-table { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
                                                         h3 { margin-top: 0; color: #1e293b; }
                                                                 table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
                                                                         th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
                                                                                 th { background: #f8fafc; color: #475569; font-weight: bold; }
                                                                                         tr:hover { background: #f8fafc; }
                                                                                                 .status-ativo { color: #16a34a; font-weight: bold; }
                                                                                                     </style>
                                                                                                     </head>
                                                                                                     <body>
                                                                                                         <div class="topbar">⚙️ Painel de Controle - Relatório de Membros Ativos</div>
                                                                                                             <div class="main-content">
                                                                                                                     <div class="card-table">
                                                                                                                                 <h3>Lista de Usuários Cadastrados</h3>
                                                                                                                                             <table>
                                                                                                                                                             <thead>
                                                                                                                                                                                 <tr>
                                                                                                                                                                                                         <th>Código</th>
                                                                                                                                                                                                                                 <th>Nome</th>
                                                                                                                                                                                                                                                         <th>E-mail</th>
                                                                                                                                                                                                                                                                                 <th>Status</th>
                                                                                                                                                                                                                                                                                                     </tr>
                                                                                                                                                                                                                                                                                                                     </thead>
                                                                                                                                                                                                                                                                                                                                     <tbody id="tabela-membros">
                                                                                                                                                                                                                                                                                                                                                         <tr><td colspan="4" style="text-align:center; color:#64748b;">Carregando dados da lista...</td></tr>
                                                                                                                                                                                                                                                                                                                                                                         </tbody>
                                                                                                                                                                                                                                                                                                                                                                                     </table>
                                                                                                                                                                                                                                                                                                                                                                                             </div>
                                                                                                                                                                                                                                                                                                                                                                                                 </div>

                                                                                                                                                                                                                                                                                                                                                                                                     <script>
                                                                                                                                                                                                                                                                                                                                                                                                             const API_URL = 'https://workers.dev';

                                                                                                                                                                                                                                                                                                                                                                                                                     async function carregarMembros() {
                                                                                                                                                                                                                                                                                                                                                                                                                                 const tbody = document.getElementById('tabela-membros');
                                                                                                                                                                                                                                                                                                                                                                                                                                             try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                             const response = await fetch(`${API_URL}/api/admin/membros`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                             if (!response.ok) { throw new Error(); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             const membros = await response.json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             if(membros.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Nenhum membro cadastrado até o momento.</td></tr>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     tbody.innerHTML = membros.map(m => `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         <tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 <td><strong>${m.codigo}</strong></td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         <td>${m.nome}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 <td>${m.e_mail || m.email}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         <td class="status-ativo">${m.status || 'Ativo'}</td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             `).join('');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#b91c1c;">Erro ao ler registros. Verifique a API.</td></tr>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     carregarMembros();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         </html>
