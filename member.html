 <!DOCTYPE html>
 <html lang="pt-BR">
 <head>
     <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
             <title>Minha Conta - Clube Up Mobility</title>
                 <style>
                         body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
                                 .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 500px; margin: 40px auto; text-align: center; }
                                         .avatar { width: 80px; height: 80px; background: #2563eb; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; margin: 0 auto 15px auto; }
                                                 h2 { margin: 0 0 10px 0; color: #1e293b; }
                                                         .info { font-size: 16px; color: #64748b; margin-bottom: 20px; }
                                                                 .badge { background: #dcfce7; color: #15803d; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; display: inline-block; }
                                                                         .btn-logout { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 20px; width: 100%; }
                                                                             </style>
                                                                             </head>
                                                                             <body>
                                                                                 <div class="card">
                                                                                         <div class="avatar" id="user-initial">U</div>
                                                                                                 <h2 id="user-name">Carregando...</h2>
                                                                                                         <div class="info">Código do Cartão: <strong id="user-code">-</strong></div>
                                                                                                                 <div>Status da Conta: <span class="badge" id="user-status">Ativo</span></div>
                                                                                                                         <button class="btn-logout" onclick="logout()">Sair da Conta</button>
                                                                                                                             </div>

                                                                                                                                 <script>
                                                                                                                                         const API_URL = window.location.origin;
                                                                                                                                                 const token = localStorage.getItem('clube_token');

                                                                                                                                                         if (!token) { window.location.href = 'index.html'; }

                                                                                                                                                                 async function carregarPerfil() {
                                                                                                                                                                             try {
                                                                                                                                                                                             const response = await fetch(`${API_URL}/api/membros/perfil`, {
                                                                                                                                                                                                                 headers: { 'Authorization': `Bearer ${token}` }
                                                                                                                                                                                                                                 });
                                                                                                                                                                                                                                                 if (!response.ok) { throw new Error(); }
                                                                                                                                                                                                                                                                 const user = await response.json();

                                                                                                                                                                                                                                                                                 document.getElementById('user-name').innerText = user.nome;
                                                                                                                                                                                                                                                                                                 document.getElementById('user-code').innerText = user.codigo;
                                                                                                                                                                                                                                                                                                                 document.getElementById('user-initial').innerText = user.nome.charAt(0).toUpperCase();
                                                                                                                                                                                                                                                                                                                                 document.getElementById('user-status').innerText = user.status || 'Ativo';
                                                                                                                                                                                                                                                                                                                                             } catch (err) {
                                                                                                                                                                                                                                                                                                                                                             localStorage.removeItem('clube_token');
                                                                                                                                                                                                                                                                                                                                                                             window.location.href = 'index.html';
                                                                                                                                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                                                                                                                                                 }

                                                                                                                                                                                                                                                                                                                                                                                                         function logout() {
                                                                                                                                                                                                                                                                                                                                                                                                                     localStorage.removeItem('clube_token');
                                                                                                                                                                                                                                                                                                                                                                                                                                 window.location.href = 'index.html';
                                                                                                                                                                                                                                                                                                                                                                                                                                         }

                                                                                                                                                                                                                                                                                                                                                                                                                                                 carregarPerfil();
                                                                                                                                                                                                                                                                                                                                                                                                                                                     </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                     </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                     </html>
