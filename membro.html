<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Clube UP Mobility - Desconto</title>
                <style>
                        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #eef5fc; }
                                .box { max-width: 400px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
                                        input { width: 80%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; text-align: center; }
                                                button { width: 85%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
                                                        #timer { color: red; font-weight: bold; margin-top: 10px; font-size: 18px; }
                                                            </style>
                                                                <script src="https://cloudflare.com"></script>
                                                                </head>
                                                                <body>
                                                                    <div class="box">
                                                                            <h2>UP Mobility</h2>
                                                                                    <p>Gasolina: <b>R\$ 5,69</b> | Etanol: <b>R\$ 3,84</b></p>
                                                                                            <div id="form">
                                                                                                        <input type="text" id="cpf" placeholder="Digite seu CPF">
                                                                                                                    <button onclick="gerar()">Gerar QR Code Temporário</button>
                                                                                                                            </div>
                                                                                                                                    <div id="cupom" style="display:none; margin-top:20px;">
                                                                                                                                                <h3>Apresente no Caixa:</h3>
                                                                                                                                                            <div id="qrcode" style="display:inline-block; padding:10px; background:white;"></div>
                                                                                                                                                                        <div id="timer">Expira em: 05:00</div>
                                                                                                                                                                                </div>
                                                                                                                                                                                    </div>
                                                                                                                                                                                        <script>
                                                                                                                                                                                                function gerar() {
                                                                                                                                                                                                            const cpf = document.getElementById('cpf').value.replace(/\D/g, '');
                                                                                                                                                                                                                        if(cpf.length !== 11) return alert('Digite 11 números do CPF');
                                                                                                                                                                                                                                    const agora = new Date();
                                                                                                                                                                                                                                                const hm = agora.getHours().toString().padStart(2,'0') + agora.getMinutes().toString().padStart(2,'0');
                                                                                                                                                                                                                                                            document.getElementById('form').style.display = 'none';
                                                                                                                                                                                                                                                                        document.getElementById('cupom').style.display = 'block';
                                                                                                                                                                                                                                                                                    new QRCode(document.getElementById("qrcode"), `UPM-${cpf}-${hm}`);
                                                                                                                                                                                                                                                                                                let tempo = 300;
                                                                                                                                                                                                                                                                                                            setInterval(() => {
                                                                                                                                                                                                                                                                                                                            let min = Math.floor(tempo / 60).toString().padStart(2,'0');
                                                                                                                                                                                                                                                                                                                                            let seg = (tempo % 60).toString().padStart(2,'0');
                                                                                                                                                                                                                                                                                                                                                            document.getElementById('timer').innerText = `Expira em: ${min}:${seg}`;
                                                                                                                                                                                                                                                                                                                                                                            if (--tempo < 0) location.reload();
                                                                                                                                                                                                                                                                                                                                                                                        }, 1000);
                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                    </script>
                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                    </html>
